[project]
name = "cthulhu-news"
version = "0.1.0"
description = "Cthulhu-inspired news"
authors = [
    { name = "Mysterious Ben", email = "datascience@tuta.io" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.0",
    "envparse>=0.2.0",
    "loguru>=0.7.3",
    "httpx>=0.28.1",
    "pymongo>=4.17.0",
    "openai>=2.40.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.30",
    "spacy>=3.8.0",
    "lxml[html-clean]>=6.1.0",
    "tenacity>=9.1.0",
    "litellm>=1.87.0",
    "anthropic>=0.105.0",
    "prefect>=3.7.0",
    "click>=8.4.0",
]

[project.optional-dependencies]
db = [
    "newspaper3k>=0.2.8"
]
web = [
    "cachetools>=7.1.0",
    "fastapi>=0.136.0",
    "jinja2>=3.1.6",
    "psycopg[pool]>=3.3.0",
    "uvicorn[standard]>=0.48.0",
    "pgvector>=0.4.0",
    "fastembed>=0.8.0"
]
dev = [
    "pylint>=4.0.0",
    "pytest>=9.0.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "psycopg[binary]>=3.3.0",
    "ruff>=0.15.0"
]
jupyter = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.0",
    "pandas>=3.0.0"
]

# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
exclude = [
    ".eggs",
    ".git",
    ".github",
    ".mypy_cache",
    ".tox",
    ".venv",
    "notebooks",
    "resources",
    ".ipynb_checkpoints",
    "__pycache__",
    "_build",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["web", "db", "shared", "prefect"]
force-single-line = false
split-on-trailing-comma = true

[tool.pytest.ini_options]
markers = [
    "integration: integration testing (tests require valid credentials and can be slow)",
]
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.mypy]
enable_incomplete_feature = ["InlineTypedDict"]
